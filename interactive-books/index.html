<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Elevor360D children’s books, stories and interactive reading adventures"><title>Our Books | Elevor360D Books</title><style>
:root{--ink:#25314d;--purple:#6752ad;--pink:#ff8eae;--yellow:#ffe08a;--teal:#37b9aa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff9ed;color:var(--ink);font:16px/1.6 system-ui,Arial,sans-serif}a{color:inherit}header{background:#31285d;color:white;box-shadow:0 4px 0 #ffca79}nav{max-width:1150px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px;text-decoration:none;font-size:1.16rem;font-weight:900}.brand img{width:70px;height:70px;object-fit:contain;border-radius:50%}.navlinks{display:flex;flex-wrap:wrap;gap:12px}.navlinks a{color:white;text-decoration:none;font-weight:750;padding:8px 12px;border-radius:20px}.navlinks a:hover,.navlinks a:focus{background:#59498e}.wrap{max-width:1150px;margin:auto;padding:0 22px}.hero{background:radial-gradient(circle at 80% 20%,#fff0a8 0 12%,transparent 12.3%),linear-gradient(120deg,#f7b7d0,#f9e3a4 55%,#a7e8e2);padding:62px 0 72px}.hero-grid{display:grid;grid-template-columns:1.35fr .85fr;align-items:center;gap:35px}.eyebrow{font-weight:900;letter-spacing:.14em;color:#63417d;text-transform:uppercase;font-size:.82rem}.hero h1{font-size:clamp(2.7rem,6vw,5rem);line-height:1.05;margin:10px 0 18px;color:#332b62}.hero p{font-size:1.15rem;max-width:650px}.hero-art{border-radius:36px;background:#fff8e7;box-shadow:12px 13px 0 #8b72b6;padding:28px;text-align:center;transform:rotate(2deg)}.hero-art .big{font-size:clamp(5rem,13vw,9rem);line-height:1.1}.hero-art strong{display:block;font-size:1.5rem;color:#614e97}.btn{display:inline-block;border:0;background:#6549a4;color:white;border-radius:30px;padding:12px 22px;text-decoration:none;font-weight:800;margin:8px 8px 0 0;box-shadow:0 4px 0 #44316e}.btn.gold{background:#ffcd66;color:#332b62;box-shadow:0 4px 0 #d99c36}.btn:hover{transform:translateY(-1px)}section.content{padding:42px 0}.section-title{text-align:center;font-size:clamp(1.8rem,3.5vw,2.5rem);margin:0 0 8px}.section-intro{text-align:center;color:#65718a;margin:0 0 28px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.tile{background:white;border:2px solid #efe4fd;border-radius:25px;padding:26px;box-shadow:0 8px 0 #eadcf7}.tile .emoji{font-size:3.6rem}.tile h3{font-size:1.3rem;margin:12px 0 6px}.tile p{margin:0}.panel{background:white;border:2px solid #e9dff4;border-radius:24px;padding:28px;box-shadow:0 7px 0 #e9dff4}.highlight{background:#e2f8f2;border-radius:24px;padding:35px}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:22px}.book{background:#fff;border-radius:23px;border:2px solid #ebdff4;padding:20px;box-shadow:0 7px 0 #eadff6}.book img{display:block;width:100%;height:240px;object-fit:contain;border-radius:15px;background:#fff3dd}.book h2{font-size:1.28rem;margin:15px 0 6px}.muted{color:#6d7486}.back{display:inline-block;margin-bottom:20px;color:#5e48a0;font-weight:800}footer{background:#31285d;color:white;text-align:center;padding:30px 20px;margin-top:35px}footer a{color:#ffe6a1}@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.hero{padding:35px 0}.hero-art{max-width:390px;margin:auto}.brand img{width:54px;height:54px}}
</style></head><body><header><nav><a class="brand" href="../index.html"><img src="../images/elevor360d-logo.png" alt="Elevor360D gold logo"><span>Elevor360D Books</span></a><div class="navlinks"><a href="../index.html">Home</a><a href="../interactive-books/index.html">Our Books</a><a href="../about.html">About</a><a href="../contact.html">Contact</a></div></nav></header><section class="hero"><div class="wrap"><div class="eyebrow">📚 The story shelf</div><h1 style="font-size:clamp(2.4rem,5vw,4rem);margin:12px 0">Our Book Library</h1><p>Find your next adventure! Try free interactive previews when available.</p></div></section><section class="content"><div class="wrap"><a class="back" href="../index.html">← Back to Home</a><div id="booklist" class="books" aria-live="polite">Loading books…</div></div></section><footer>© Elevor360D · Stories, imagination and interactive adventures · <a href="mailto:elevor360@gmail.com">Contact us</a></footer><script>
(async()=>{
const host=document.getElementById('booklist');
try{
const [a,b]=await Promise.all([fetch('./library.json?x='+Date.now()),fetch('./previews/available.json?x='+Date.now())]);
if(!a.ok||!b.ok)throw Error('Cannot load book files');
const books=await a.json(),available=await b.json();
if(!Array.isArray(books)||!Array.isArray(available))throw Error('Invalid book files');
if(!books.length){host.innerHTML='<div class="panel"><h2>🌟 Our books are coming soon!</h2><p>We are preparing our first stories. Check back for new adventures.</p></div>';return}
host.replaceChildren();
for(const book of books){const card=document.createElement('article');card.className='book';
if(book.image){const img=document.createElement('img');img.alt='Cover of '+book.title;img.src='../images/'+encodeURIComponent(book.image);card.append(img)}else{const art=document.createElement('div');art.style.cssText='height:240px;display:grid;place-items:center;background:#f7edff;border-radius:15px;font-size:6rem';art.textContent='📖';card.append(art)}
const title=document.createElement('h2');title.textContent=book.title||'Untitled book';card.append(title);
const description=document.createElement('p');description.textContent=book.description||'';card.append(description);
if(available.includes(book.slug)){const link=document.createElement('a');link.className='btn';link.textContent='📖 Read Free Preview';link.href='previews/'+encodeURIComponent(book.slug)+'.html';card.append(link)}else{const status=document.createElement('p');status.className='muted';status.textContent='✨ Interactive preview coming soon';card.append(status)}
if(book.videoUrl){const video=document.createElement('a');video.className='btn gold';video.textContent='▶ Watch Video';video.href=book.videoUrl;video.target='_blank';video.rel='noopener noreferrer';card.append(video)}host.append(card)}
}catch(err){host.textContent='Unable to load books. View the catalogue through GitHub Pages or a local web server. '+err.message}
})();
</script></body></html>
